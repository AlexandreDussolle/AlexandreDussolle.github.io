  <script>
    var MOON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
               '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    var SUN  = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" ' +
               'stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
               '<circle cx="12" cy="12" r="4.5"/>' +
               '<path fill="none" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41' +
               'M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';

    var btn = document.getElementById("theme-toggle");
    var dark = document.body.classList.contains("latex-dark");

    function apply() {
      document.body.classList.toggle("latex-dark", dark);
      btn.innerHTML = dark ? SUN : MOON;
    }

    btn.addEventListener("click", function () {
      dark = !dark;
      sessionStorage.setItem("theme", dark ? "dark" : "light");
      apply();
    });

    apply();
  </script>
